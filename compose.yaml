services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hackshield
      POSTGRES_USER: hackshield
      POSTGRES_PASSWORD: hackshield
    ports:
      - '5432:5432'
    volumes:
      - hackshield_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hackshield -d hackshield']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hackshield_postgres:
