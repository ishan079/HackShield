<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Listen, ask, connect</title>
  <desc id="desc">Three concentric orange rings with an orange center and transparent knockout lettering for Listen, Ask, Connect, plus a small dark marker outside the outer ring.</desc>
  <defs>
    <mask id="center-knockout" maskUnits="userSpaceOnUse" x="92" y="92" width="116" height="116" style="mask-type:luminance">
      <circle cx="150" cy="150" r="58" fill="#fff"/>
      <g fill="#000" font-family="'DM Mono', 'Courier New', monospace" font-size="15" font-weight="600" letter-spacing="1.5" text-anchor="middle">
        <text x="150" y="132">LISTEN</text>
        <text x="150" y="154">ASK</text>
        <text x="150" y="176">CONNECT</text>
      </g>
    </mask>
  </defs>
  <g fill="none" stroke="#d9633a">
    <circle cx="150" cy="150" r="148" stroke-width="1.2" opacity=".32"/>
    <circle cx="150" cy="150" r="102" stroke-width="2.4" opacity=".58"/>
  </g>
  <circle cx="150" cy="150" r="58" fill="#d9633a" stroke="#d9633a" stroke-width="2.4" mask="url(#center-knockout)"/>
  <circle cx="260" cy="19" r="6" fill="#202522"/>
</svg>
