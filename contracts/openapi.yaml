openapi: 3.1.0
info:
  title: HackShield Core API
  version: 1.0.0
  description: >-
    Authoritative contract between the HackShield Next.js frontend and an
    independently deployable backend. All timestamps are UTC ISO-8601 values.
servers:
  - url: /api/v1
    description: Next.js reverse-proxy path
  - url: http://localhost:5000/api/v1
    description: Local backend server
tags:
  - name: Mini CTF
  - name: Flagship CTF
  - name: Terminal
  - name: Stats
  - name: Programs
  - name: Resources

paths:
  /ctf/mini-sprints:
    get:
      operationId: listMiniSprints
      tags: [Mini CTF]
      summary: List current and scheduled Mini CTF sprints
      responses:
        '200':
          description: Sprint list ordered by start time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniSprintListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /ctf/mini-sprints/{sprintId}/register:
    post:
      operationId: registerMiniSprint
      tags: [Mini CTF]
      summary: Register a participant for a Mini CTF sprint
      parameters:
        - $ref: '#/components/parameters/SprintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniSprintRegistrationRequest'
      responses:
        '201':
          description: Registration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniSprintRegistrationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /ctf/flagship/status:
    get:
      operationId: getFlagshipStatus
      tags: [Flagship CTF]
      summary: Get authoritative flagship event timing and registration state
      responses:
        '200':
          description: Current event status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagshipStatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /ctf/flagship/register:
    post:
      operationId: preRegisterFlagship
      tags: [Flagship CTF]
      summary: Pre-register a team for the flagship CTF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagshipRegistrationRequest'
      responses:
        '201':
          description: Team registration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagshipRegistrationResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /terminal/validate-flag:
    post:
      operationId: validateTerminalFlag
      tags: [Terminal]
      summary: Validate a sandbox challenge flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateFlagRequest'
      responses:
        '200':
          description: Validation result; an incorrect flag is still HTTP 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagValidationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /terminal/challenges:
    get:
      operationId: listTerminalChallenges
      tags: [Terminal]
      summary: List public browser-sandbox challenges
      responses:
        '200':
          description: Public challenge list without solution flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalChallengeListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /stats/live:
    get:
      operationId: getLiveStats
      tags: [Stats]
      summary: Get homepage community statistics
      responses:
        '200':
          description: Display-ready statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStatsResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /programs/apply:
    post:
      operationId: applyToProgram
      tags: [Programs]
      summary: Apply to or join the waitlist for a club program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramApplicationRequest'
      responses:
        '201':
          description: Application received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramApplicationResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /resources:
    get:
      operationId: listResources
      tags: [Resources]
      summary: Search and filter the public resource catalog
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/ResourceCategory'
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Filtered resource collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    SprintId:
      name: sprintId
      in: path
      required: true
      schema:
        type: string
        pattern: '^mini-[a-zA-Z0-9-]+$'
        example: mini-14

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: One or more fields are invalid.
              details:
                - field: email
                  issue: Must be a valid IIT Patna email address.
            timestamp: '2026-11-07T02:40:00.000Z'
    NotFound:
      description: Requested entity does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Registration or application already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: ALREADY_REGISTERED
              message: This email is already registered.
            timestamp: '2026-11-07T02:40:00.000Z'
    RateLimited:
      description: Too many attempts; Retry-After header is required
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server failure with no sensitive internals exposed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Timestamp:
      type: string
      format: date-time

    FieldValidationError:
      type: object
      additionalProperties: false
      required: [field, issue]
      properties:
        field: { type: string }
        issue: { type: string }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error, timestamp]
      properties:
        success: { const: false }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              oneOf:
                - type: array
                  items: { $ref: '#/components/schemas/FieldValidationError' }
                - type: object
                - type: 'null'
        timestamp: { $ref: '#/components/schemas/Timestamp' }

    MiniSprint:
      type: object
      additionalProperties: false
      required: [id, title, status, statusColor, startsAt, endsAt, durationMinutes, challengeCount, difficulty, format, reward, description, registrationOpen]
      properties:
        id: { type: string, pattern: '^mini-[a-zA-Z0-9-]+$' }
        title: { type: string }
        status:
          enum: [REGISTRATION_OPEN, REGISTRATION_OPENING_SOON, REGISTRATION_CLOSED, LIVE, COMPLETED]
        statusColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        startsAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt: { $ref: '#/components/schemas/Timestamp' }
        durationMinutes: { type: integer, minimum: 1 }
        challengeCount: { type: integer, minimum: 0 }
        difficulty: { enum: [Beginner, Intermediate, Advanced, Mixed] }
        format: { enum: [Solo, Duos, Solo or Duos, Teams] }
        reward: { type: string }
        description: { type: string }
        registrationOpen: { type: boolean }

    MiniSprintListResponse:
      type: object
      additionalProperties: false
      required: [success, data, timestamp]
      properties:
        success: { const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/MiniSprint' }
        timestamp: { $ref: '#/components/schemas/Timestamp' }

    MiniSprintRegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, pwnUsername]
      properties:
        email: { type: string, format: email, pattern: '@iitp\.ac\.in$' }
        pwnUsername:
          type: string
          minLength: 1
          description: >-
            Trimmed pwn.college username. Matches pwn.college registration
            validation: any non-empty value except an email-shaped value.

    MiniSprintRegistration:
      type: object
      additionalProperties: false
      required: [registrationId, sprintId, email, pwnUsername, status, arenaUrl, registeredAt]
      properties:
        registrationId: { type: string }
        sprintId: { type: string }
        email: { type: string, format: email }
        pwnUsername: { type: string }
        status: { enum: [CONFIRMED, WAITLISTED] }
        arenaUrl:
          type: [string, 'null']
          format: uri
        registeredAt: { $ref: '#/components/schemas/Timestamp' }

    MiniSprintRegistrationResponse:
      $ref: '#/components/schemas/SuccessMiniSprintRegistration'
    SuccessMiniSprintRegistration:
      type: object
      additionalProperties: false
      required: [success, data, timestamp]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/MiniSprintRegistration' }
        timestamp: { $ref: '#/components/schemas/Timestamp' }

    FlagshipStatus:
      type: object
      additionalProperties: false
      required: [title, status, eventStart, eventEnd, registrationOpens, registrationCloses, serverTime, prizePool, minTeamSize, maxTeamSize]
      properties:
        title: { type: string }
        status: { enum: [REGISTRATION_OPENING_SOON, REGISTRATION_OPEN, REGISTRATION_CLOSED, LIVE, COMPLETED] }
        eventStart: { $ref: '#/components/schemas/Timestamp' }
        eventEnd: { $ref: '#/components/schemas/Timestamp' }
        registrationOpens: { $ref: '#/components/schemas/Timestamp' }
        registrationCloses: { $ref: '#/components/schemas/Timestamp' }
        serverTime: { $ref: '#/components/schemas/Timestamp' }
        prizePool: { type: string }
        minTeamSize: { type: integer, minimum: 1 }
        maxTeamSize: { type: integer, minimum: 1 }

    FlagshipStatusResponse:
      type: object
      additionalProperties: false
      required: [success, data, timestamp]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/FlagshipStatus' }
        timestamp: { $ref: '#/components/schemas/Timestamp' }

    FlagshipRegistrationRequest:
      type: object
      additionalProperties: false
      required: [teamName, email, membersCount]
      properties:
        teamName: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        membersCount: { type: integer, minimum: 1, maximum: 4 }

    FlagshipRegistration:
      type: object
      additionalProperties: false
      required: [registrationId, teamName, captainEmail, membersCount, status, registeredAt]
      properties:
        registrationId: { type: string }
        teamName: { type: string }
        captainEmail: { type: string, format: email }
        membersCount: { type: integer }
        status: { enum: [PRE_REGISTERED, CONFIRMED, WAITLISTED] }
        registeredAt: { $ref: '#/components/schemas/Timestamp' }

    FlagshipRegistrationResponse:
      type: object
      additionalProperties: false
      required: [success, data, timestamp]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/FlagshipRegistration' }
        timestamp: { $ref: '#/components/schemas/Timestamp' }

    ValidateFlagRequest:
      type: object
      additionalProperties: false
      required: [flag]
      properties:
        flag: { type: string, minLength: 6, maxLength: 256 }

    FlagValidation:
      type: object
      additionalProperties: false
      required: [correct, pointsAwarded, rank, badgeEarned, message]
      properties:
        correct: { type: boolean }
        pointsAwarded: { type: integer, minimum: 0 }
        rank: { type: [integer, 'null'], minimum: 1 }
        badgeEarned: { type: [string, 'null'] }
        message: { type: string }

    FlagValidationResponse:
      type: object
      additionalProperties: false
      required: [success, data, timestamp]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/FlagValidation' }
        timestamp: { $ref: '#/components/schemas/Timestamp' }

    TerminalChallenge:
      type: object
      additionalProperties: false
      required: [id, title, prompt, ciphertext, hint, category, points]
      properties:
        id: { type: string }
        title: { type: string }
        prompt: { type: string }
        ciphertext: { type: string }
        hint: { type: [string, 'null'] }
        category: { enum: [Crypto, Web, Pwn, Reverse, Forensics, OSINT] }
        points: { type: integer, minimum: 0 }

    TerminalChallengeListResponse:
      type: object
      additionalProperties: false
      required: [success, data, timestamp]
      properties:
        success: { const: true }
        data: { type: array, items: { $ref: '#/components/schemas/TerminalChallenge' } }
        timestamp: { $ref: '#/components/schemas/Timestamp' }

    LiveStat:
      type: object
      additionalProperties: false
      required: [key, value, suffix, label, sub]
      properties:
        key: { enum: [activeMembers, ctfCompetitions, handsOnLabs, yearsOfExcellence] }
        value: { type: integer, minimum: 0 }
        suffix: { type: string, maxLength: 4 }
        label: { type: string }
        sub: { type: string }

    LiveStatsResponse:
      type: object
      additionalProperties: false
      required: [success, data, timestamp]
      properties:
        success: { const: true }
        data: { type: array, items: { $ref: '#/components/schemas/LiveStat' } }
        timestamp: { $ref: '#/components/schemas/Timestamp' }

    ProgramApplicationRequest:
      type: object
      additionalProperties: false
      required: [programId, email, experienceLevel]
      properties:
        programId: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        experienceLevel: { enum: [Beginner, Intermediate, Advanced] }
        motivation: { type: string, maxLength: 1000 }

    ProgramApplication:
      type: object
      additionalProperties: false
      required: [applicationId, programId, email, status, submittedAt]
      properties:
        applicationId: { type: string }
        programId: { type: string }
        email: { type: string, format: email }
        status: { enum: [RECEIVED, WAITLISTED, ACCEPTED] }
        submittedAt: { $ref: '#/components/schemas/Timestamp' }

    ProgramApplicationResponse:
      type: object
      additionalProperties: false
      required: [success, data, timestamp]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/ProgramApplication' }
        timestamp: { $ref: '#/components/schemas/Timestamp' }

    ResourceCategory:
      enum: [platforms, tools, guides, community]

    Resource:
      type: object
      additionalProperties: false
      required: [id, category, title, badge, description, tags, url, icon]
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/ResourceCategory' }
        title: { type: string }
        badge: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        url: { type: string, format: uri-reference }
        icon: { enum: [terminal, globe, lock, cpu, code, file, bookmark, community] }

    ResourceList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        total: { type: integer, minimum: 0 }

    ResourceListResponse:
      type: object
      additionalProperties: false
      required: [success, data, timestamp]
      properties:
        success: { const: true }
        data: { $ref: '#/components/schemas/ResourceList' }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
